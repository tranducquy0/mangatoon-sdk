[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mangatoon-sdk"
version = "0.1.0"
description = "Async Python SDK for the MangaToon / NovelToon content API: comics, novels and chat stories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mangatoon", "noveltoon", "comics", "novels", "chat-story", "async", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
cli = ["rich>=13.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
mangatoon = "mangatoon.cli:main"

[project.urls]
Homepage = "https://github.com/example/mangatoon-sdk"
Issues = "https://github.com/example/mangatoon-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mangatoon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:mangatoon.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
